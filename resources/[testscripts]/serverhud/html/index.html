<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HUD Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />


  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Server Info Top Right -->
  <div class="server-info">
    <div class="server-name" id="server-name">KERALAM SERVER</div>
    <div class="discord-link">
      <i class="fa-brands fa-discord"></i> discord.gg/xlantis-city
    </div>
  </div>

  <!-- Main HUD Bar -->
  <div class="hud-bar">
    <div class="hud-sub-bar-horizontal">
        <div class="hud-item">
          <div class="hud-icon diamond"><i class="fas fa-id-badge"></i></div>
          <span class="label">ID</span>
          <span class="value cyan" id="player-id">454</span>
        </div>
        <div class="hud-item">
          <div class="hud-icon diamond"><i class="fas fa-users"></i></div>
          <span class="label">Players</span>
          <span class="value cyan" id="total-players">387</span>
        </div>
        <div class="separator"></div>
        <div class="hud-item">
          <div class="hud-icon diamond"><i class="fas fa-briefcase"></i></div>
          <span class="label">Job</span>
          <span class="value cyan" id="job-label">K-TEAM</span>
          <span class="value red" id="job">DEVELOPER</span>
        </div>
    </div>

    <div class="hud-sub-bar-vertical">
        <div class="hud-item">
          <div class="hud-icon diamond"><i class="fas fa-clock"></i></div>
          <span class="label">Time</span>
          <span class="value cyan" id="server-time">21:59</span>
        </div>
        <div class="hud-item">
          <div class="hud-icon diamond"><i class="fas fa-wallet"></i></div>
          <span class="label">Cash</span>
          <span class="value red" id="cash">$1,020,000</span>
        </div>
        <div class="hud-item">
          <div class="hud-icon diamond"><i class="fas fa-university"></i></div>
          <span class="label">Bank</span>
          <span class="value cyan" id="bank">$11,077,652</span>
        </div>
    </div>
  </div>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
